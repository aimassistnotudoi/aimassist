<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>働く車 社会の歯車特集</title>

    <!-- LINEに貼った時の見た目が変わるらしい の始点 -->
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://shadowverse-evolve.com/wordpress/wp-content/images/cardlist/BP01/bp01_004.png">
    <!-- LINEに貼った時の見た目が変わるらしい の終点 -->

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cardlistdiv">
        <h1 class="header">カード検索</h1>
        <a class="menubutton cardlist" href="cardlist/index.html">カードリストを表示</a>
    </div>
    <div class="deckdiv">
        <h1 class="header">デッキ作成</h1>
        <div class="claniconlist">
            <div class="clanicon">
                <input type="radio" name="clan" id="elf" value="エルフ">
                <label for="elf">
                    <img src="assets/icon/elf.svg" alt="エルフ">
                </label>
            </div>
            <div class="clanicon">
                <input type="radio" name="clan" id="royal" value="ロイヤル">
                <label for="royal">
                    <img src="assets/icon/royal.svg" alt="ロイヤル">
                </label>
            </div>
            <div class="clanicon">
                <input type="radio" name="clan" id="witch" value="ウィッチ">
                <label for="witch">
                    <img src="assets/icon/witch.svg" alt="ウィッチ">
                </label>
            </div>
            <div class="clanicon">
                <input type="radio" name="clan" id="dragon" value="ドラゴン">
                <label for="dragon">
                    <img src="assets/icon/dragon.svg" alt="ドラゴン">
                </label>
            </div>
            <div class="clanicon">
                <input type="radio" name="clan" id="nightmare" value="ナイトメア">
                <label for="nightmare">
                    <img src="assets/icon/nightmare.svg" alt="ナイトメア">
                </label>
            </div>
            <div class="clanicon">
                <input type="radio" name="clan" id="bishop" value="ビショップ">
                <label for="bishop">
                    <img src="assets/icon/bishop.svg" alt="ビショップ">
                </label>
            </div>
        </div>
        <div>
            <input type="text" id="sign-in" placeholder="user name">
            （忘れないようなやつ、苗字ひらがなとか）
            <div>
                <input type="checkbox" id="sign-up"><label for="sign-up">ユーザー登録</label>
            </div>
        </div>
        <button class="menubutton deck" id="deck-button">新しいデッキを作成</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
