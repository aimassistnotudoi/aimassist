name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # リポジトリ全体を取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.jsを用意
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evolveCardEditor/package-lock.json

      # evolveCardEditor側の依存関係をインストール
      - name: Install dependencies
        working-directory: evolveCardEditor
        run: npm ci

      # evolveCardEditorをビルド
      - name: Build evolveCardEditor
        working-directory: evolveCardEditor
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Pagesに渡す公開用ディレクトリを作る
      - name: Prepare deployment directory
        run: |
          mkdir public

          # 以外をコピー
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='evolveCardEditor' \
            --exclude='public' \
            ./ public/

          # ビルド済みevolveCardEditorを配置
          mkdir -p public/evolveCardEditor
          rsync -av evolveCardEditor/dist/ public/evolveCardEditor/

      # GitHub Pages用のartifactを作る
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4